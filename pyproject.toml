[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vane"
version = "1.0.0"
description = "VANE: hidden-state trajectory geometry predicts reasoning failures in LLMs (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "optuna>=3.4",
]

[project.optional-dependencies]
experiments = [
    "transformers>=4.51",
    "accelerate>=0.30",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
    "tqdm",
]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
